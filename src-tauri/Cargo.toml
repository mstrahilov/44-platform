[package]
name = "forty-four-desktop"
version = "0.1.0"
description = "The minimal desktop shell for 44OS"
authors = ["forty four"]
edition = "2021"
rust-version = "1.77.2"
homepage = "https://44os.com"

[lib]
name = "forty_four_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "=2.3.3"
