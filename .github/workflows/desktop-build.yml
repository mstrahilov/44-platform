name: Desktop private build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-desktop-build
    paths:
      - .github/workflows/desktop-build.yml
      - package.json
      - package-lock.json
      - scripts/desktop-contract.mjs
      - src-tauri/**

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Verify desktop boundary
        run: node scripts/desktop-contract.mjs
      - name: Check Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned NSIS installer
        run: npm run desktop:build -- --bundles nsis
      - name: Prepare deterministic private artifact
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          New-Item -ItemType Directory -Force -Path "dist/desktop" | Out-Null
          $filename = "44OS-0.1.0-windows-x64-setup.exe"
          $destination = Join-Path "dist/desktop" $filename
          Copy-Item $installers[0].FullName $destination
          $hash = (Get-FileHash -Algorithm SHA256 $destination).Hash.ToLowerInvariant()
          "$hash  $filename" | Set-Content -Encoding utf8 "dist/desktop/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: 44OS-windows-x64-private
          path: dist/desktop/*
          if-no-files-found: error
          retention-days: 14
